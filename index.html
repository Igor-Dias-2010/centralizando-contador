<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div>
        <h1>Contador</h1>
        <p id="resultado">0</p>
        <div>
        <button id="botao" onclick="divcinco()">/5</button>
        <button id="botao" onclick="divdois()">/2</button>
        <button id="botao" onclick="menosum()">-1</button>
        <button id="reset" onclick="reset()">Reset</button>
        <button id="botao" onclick="maisum()">+1</button>
        <button id="botao" onclick="multidois()">*2</button>
        <button id="botao" onclick="multicinco()">*5</button>
        </div>
    </div>
    <button id="meubotao">VC ME ACHOU! me clica.</button>
    <script>

        let numero = 0 

        const botao = document.querySelector("#meubotao")
        botao.onclick = () => { alert("Você realmente me achou, seu curioso! Agora me manda print, vai.")
        render()}


        function menosum(){
            numero -= 1
            render()
        }
        function divdois(){
            numero /= 2
            render()
        }
        function divcinco(){
            numero /= 5
            render()
        }
        function reset(){
            numero = 0
            render()
        }
        function multicinco(){
            numero *= 5
            render()
        }
        function multidois(){
            numero *= 2
            render()
        }
        function maisum(){
            numero += 1
            render()
        }
        function render(){
            const p = document.querySelector("#resultado")
            p.innerText = numero
        }
    </script>
</body>
</html>
